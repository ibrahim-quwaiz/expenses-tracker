<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصروفاتي</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='5' y='25' width='90' height='60' rx='12' fill='%234f6ef7'/><rect x='5' y='42' width='90' height='16' fill='%233d5ce0'/><rect x='15' y='62' width='25' height='8' rx='4' fill='white' opacity='.7'/><circle cx='78' cy='38' r='10' fill='%23fbbf24' opacity='.9'/><circle cx='68' cy='38' r='10' fill='%23f97316' opacity='.7'/></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#f0f2f7;color:#1a1a2e;min-height:100vh;padding-bottom:90px}
.topbar{background:#fff;border-bottom:1px solid #e2e5ed;padding:0.9rem 1rem 0;position:sticky;top:0;z-index:100}
.topbar h1{font-size:1.1rem;font-weight:700;color:#1a1a2e;margin-bottom:0.7rem;text-align:center}
.tabs{display:flex;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:58px;text-align:center;padding:0.55rem 0.2rem;font-size:0.77rem;font-weight:500;color:#9ca3af;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap}
.tab.active{color:#4f6ef7;border-bottom-color:#4f6ef7}
.page{display:none;padding:1rem}
.page.active{display:block}

/* form */
.card{background:#fff;border:1px solid #e2e5ed;border-radius:14px;padding:1.1rem;margin-bottom:1rem}
.fl{display:block;font-size:0.75rem;color:#9ca3af;margin-bottom:0.35rem;margin-top:0.75rem}
.fl:first-child{margin-top:0}
textarea,input[type="text"],input[type="number"],input[type="date"],input[type="time"],select{
  width:100%;background:#f8fafc;border:1px solid #e2e5ed;border-radius:9px;
  color:#1a1a2e;font-family:'Tajawal',sans-serif;font-size:0.88rem;padding:0.65rem 0.85rem;direction:rtl
}
textarea{resize:none;height:115px;line-height:1.6}
input[type="date"],input[type="number"],input[type="time"]{direction:ltr;text-align:left}
select option{background:#fff}
textarea:focus,input:focus,select:focus{outline:none;border-color:#4f6ef7}
textarea::placeholder,input::placeholder{color:#c0c7d0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem}

/* buttons */
.btn{width:100%;padding:0.8rem;border:none;border-radius:11px;font-family:'Tajawal',sans-serif;font-size:0.92rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-main{background:#4f6ef7;color:#fff}
.btn-main:hover{background:#3d5ce0}
.btn-main:active{transform:scale(0.98)}
.btn-main:disabled{background:#e2e5ed;color:#9ca3af;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid #e2e5ed;color:#6b7280}
.btn-ghost:hover{border-color:#4f6ef7;color:#4f6ef7}
.brow{display:flex;gap:0.6rem;margin-top:0.8rem}
.brow .btn{flex:1;padding:0.7rem}

/* status */
.st{text-align:center;padding:0.65rem;border-radius:9px;margin-top:0.7rem;font-size:0.83rem;font-weight:500;display:none}
.st.ok{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;display:block}
.st.er{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;display:block}
.st.ld{background:#f8fafc;color:#6b7280;border:1px solid #e2e5ed;display:block}
.sp{display:inline-block;width:12px;height:12px;border:2px solid #e2e5ed;border-top-color:#4f6ef7;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-left:4px}
@keyframes spin{to{transform:rotate(360deg)}}

/* result */
.rc{display:none;margin-top:1rem}
.rc.show{display:block}
.rtit{font-size:0.72rem;color:#9ca3af;margin-bottom:0.65rem;padding-bottom:0.55rem;border-bottom:1px solid #e2e5ed}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:0.55rem}
.ri{background:#f8fafc;border-radius:9px;padding:0.7rem}
.ri.full{grid-column:span 2}
.ri .rl{font-size:0.65rem;color:#9ca3af;margin-bottom:0.2rem}
.ri .rv{font-size:0.88rem;font-weight:500;color:#1a1a2e}
.ri.amt .rv{color:#4f6ef7;font-size:1.15rem;font-weight:700}
.rdivider{border:none;border-top:1px solid #e2e5ed;margin:0.7rem 0}

/* summary */
.sbar{display:grid;grid-template-columns:1fr 1fr;gap:0.65rem;margin-bottom:1rem}
.sbox{background:#fff;border:1px solid #e2e5ed;border-radius:12px;padding:0.8rem;text-align:center}
.sbox .sl{font-size:0.7rem;color:#6b7280;margin-bottom:0.2rem}
.sbox .sv{font-size:1.1rem;font-weight:700;color:#4f6ef7}
.sbox .sv.g{color:#16a34a}

/* cat summary */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0.45rem;margin-bottom:0.9rem}
.cbox{background:#fff;border:1px solid #e2e5ed;border-radius:9px;padding:0.6rem 0.8rem;display:flex;justify-content:space-between}
.cbox .cn{font-size:0.75rem;color:#6b7280}
.cbox .cv{font-size:0.82rem;font-weight:700;color:#4f6ef7}

/* filters */
.fcard{background:#fff;border:1px solid #e2e5ed;border-radius:12px;padding:0.85rem;margin-bottom:1rem}
.ftit{font-size:0.72rem;color:#9ca3af;margin-bottom:0.65rem}
.frow{display:flex;gap:0.45rem;margin-bottom:0.55rem}
.frow:last-child{margin-bottom:0}
.frow input,.frow select{flex:1;background:#f8fafc;border:1px solid #e2e5ed;border-radius:8px;color:#1a1a2e;font-family:'Tajawal',sans-serif;font-size:0.8rem;padding:0.5rem 0.7rem}
.frow input[type="date"]{direction:ltr;text-align:left}
.frow select option{background:#fff}
.icnbtn{background:transparent;border:1px solid #e2e5ed;border-radius:8px;color:#6b7280;font-size:0.82rem;padding:0 0.7rem;cursor:pointer;font-family:'Tajawal',sans-serif;white-space:nowrap}
.icnbtn:hover{color:#4f6ef7;border-color:#4f6ef7}
.icnbtn.red:hover{color:#dc2626;border-color:#fecaca}

/* expense list */
.elist{display:flex;flex-direction:column;gap:0.55rem}
.eitem{background:#fff;border:1px solid #e2e5ed;border-radius:12px;padding:0.8rem 0.95rem}
.etop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.45rem}
.em{font-size:0.9rem;font-weight:500;color:#1a1a2e}
.ea{font-size:0.95rem;font-weight:700;color:#4f6ef7}
.emeta{font-size:0.7rem;color:#6b7280;margin-top:0.15rem}
.ebot{display:flex;justify-content:space-between;align-items:center;padding-top:0.45rem;border-top:1px solid #f0f2f7}
.tags{display:flex;gap:0.35rem;flex-wrap:wrap}
.tag{font-size:0.65rem;padding:2px 7px;border-radius:5px;font-weight:500}
.tcat{background:#eff2ff;color:#4f6ef7}
.ttype{background:#dcfce7;color:#16a34a}
.tmeth{background:#f5f3ff;color:#9333ea}
.eacts{display:flex;gap:0.35rem}
.abtn{background:transparent;border:1px solid #e2e5ed;border-radius:7px;color:#6b7280;font-size:0.72rem;padding:3px 9px;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all 0.15s}
.abtn:hover{color:#1a1a2e;border-color:#6b7280}
.abtn.del:hover{color:#dc2626;border-color:#fecaca}

/* banks */
.bitem{background:#fff;border:1px solid #e2e5ed;border-radius:12px;padding:0.85rem 1rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:0.55rem}
.bname{font-size:0.9rem;font-weight:500;color:#1a1a2e}
.bbal{font-size:1.05rem;font-weight:700;color:#16a34a}
.bupdated{font-size:0.68rem;color:#9ca3af;margin-top:0.15rem}

/* categories */
.cat-group{background:#fff;border:1px solid #e2e5ed;border-radius:12px;margin-bottom:0.8rem;overflow:hidden}
.cat-header{display:flex;justify-content:space-between;align-items:center;padding:0.8rem 1rem;background:#f8f9fa;border-bottom:1px solid #e2e5ed}
.cat-header-name{font-size:0.9rem;font-weight:600;color:#1a1a2e}
.cat-types{padding:0.5rem 0.8rem}
.type-item{display:flex;justify-content:space-between;align-items:center;padding:0.45rem 0.2rem;border-bottom:1px solid #f0f2f7}
.type-item:last-child{border-bottom:none}
.type-name{font-size:0.85rem;color:#6b7280}
.add-row{display:flex;gap:0.5rem;padding:0.5rem 0.2rem}
.add-row input{flex:1;background:#f8fafc;border:1px solid #e2e5ed;border-radius:8px;color:#1a1a2e;font-family:'Tajawal',sans-serif;font-size:0.82rem;padding:0.5rem 0.75rem;direction:rtl}
.add-row input:focus{outline:none;border-color:#4f6ef7}
.add-btn{background:#4f6ef7;border:none;border-radius:8px;color:#fff;font-size:0.82rem;padding:0 0.85rem;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:500}
.add-cat-row{display:flex;gap:0.5rem;margin-bottom:1rem}
.add-cat-row input{flex:1;background:#fff;border:1px solid #e2e5ed;border-radius:10px;color:#1a1a2e;font-family:'Tajawal',sans-serif;font-size:0.88rem;padding:0.65rem 0.85rem;direction:rtl}
.add-cat-row input:focus{outline:none;border-color:#4f6ef7}

/* modal */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end;justify-content:center}
.mov.show{display:flex}
.modal{background:#fff;border:1px solid #e2e5ed;border-radius:16px 16px 0 0;padding:1.2rem;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal-title{font-size:0.92rem;font-weight:700;margin-bottom:0.9rem;color:#1a1a2e}

.empty{text-align:center;color:#c0c7d0;padding:2rem 1rem;font-size:0.85rem;line-height:2.5}
.hint{font-size:0.7rem;color:#9ca3af;margin-top:0.35rem;line-height:1.6}
.toggle-link{font-size:0.82rem;color:#4f6ef7;cursor:pointer;margin-bottom:0.8rem;display:inline-block}
</style>
</head>
<body>

<div class="topbar">
  <h1>
    <svg width="22" height="22" viewBox="0 0 100 100" style="vertical-align:middle;margin-left:6px">
      <rect x="5" y="25" width="90" height="60" rx="12" fill="#4f6ef7"/>
      <rect x="5" y="42" width="90" height="16" fill="#3d5ce0"/>
      <rect x="15" y="62" width="25" height="8" rx="4" fill="white" opacity=".7"/>
      <circle cx="78" cy="38" r="10" fill="#fbbf24" opacity=".9"/>
      <circle cx="68" cy="38" r="10" fill="#f97316" opacity=".7"/>
    </svg>
    مصروفاتي
  </h1>
  <div class="tabs">
    <div class="tab active" onclick="sw('record')">تسجيل</div>
    <div class="tab" onclick="sw('view')">استعراض</div>
    <div class="tab" onclick="sw('banks')">البنوك</div>
    <div class="tab" onclick="sw('cats')">التصنيفات</div>
    <div class="tab" onclick="sw('settings')">الإعدادات</div>
  </div>
</div>

<!-- تسجيل -->
<div class="page active" id="page-record">
  <div class="card">
    <span class="toggle-link" onclick="toggleManual()">+ إضافة يدوية</span>
    <div id="manualForm" style="display:none">
      <div class="g2">
        <div><label class="fl">التاريخ</label><input type="date" id="mDate"/></div>
        <div><label class="fl">الوقت</label><input type="time" id="mTime"/></div>
      </div>
      <div class="g2" style="margin-top:0.75rem">
        <div><label class="fl">المبلغ</label><input type="number" id="mAmount" placeholder="0"/></div>
        <div><label class="fl">الجهة / المتجر</label><input type="text" id="mMerchant" placeholder="اسم الجهة"/></div>
      </div>
      <div class="g2" style="margin-top:0.75rem">
        <div><label class="fl">البنك</label><select id="mBank"><option value="">اختر</option></select></div>
        <div><label class="fl">طريقة الدفع</label>
          <select id="mMethod"><option>مدى</option><option>فيزا</option><option>تحويل</option><option>كاش</option></select>
        </div>
      </div>
      <div class="g2" style="margin-top:0.75rem">
        <div><label class="fl">التصنيف</label><select id="mCategory" onchange="updateTypeSelect('mCategory','mType')"><option value="">اختر</option></select></div>
        <div><label class="fl">الفئة</label><select id="mType"><option value="">اختر</option></select></div>
      </div>
      <label class="fl">ملاحظات</label>
      <input type="text" id="mNotes" placeholder="اختياري"/>
      <button class="btn btn-ghost" style="margin-top:0.8rem;padding:0.65rem" onclick="addManual()">إضافة</button>
      <div class="st" id="manualSt"></div>
    </div>
  </div>
  <div class="card">
    <label class="fl">رسائل البنك (واحدة أو أكثر)</label>
    <textarea id="smsText" placeholder="الصق رسالة SMS من البنك هنا...&#10;يمكنك لصق أكثر من رسالة"></textarea>
  </div>
  <button class="btn btn-main" id="analyzeBtn" onclick="analyze()">تحليل</button>
  <div class="rc card" id="resultCard">
    <div class="rtit">البيانات المستخرجة</div>
    <div id="resultItems"></div>
    <div class="st" id="analyzeSt"></div>
    <button class="btn btn-main" id="saveAnalyzedBtn" style="display:none;margin-top:0.7rem" onclick="saveAnalyzed()">إضافة للسجل</button>
  </div>
</div>

<!-- استعراض -->
<div class="page" id="page-view">
  <div class="sbar">
    <div class="sbox"><div class="sl">الإجمالي</div><div class="sv" id="totalAmt">—</div></div>
    <div class="sbox"><div class="sl">عدد العمليات</div><div class="sv g" id="totalCnt">—</div></div>
  </div>
  <div class="cgrid" id="catGrid"></div>
  <div class="fcard">
    <div class="ftit">الفلاتر</div>
    <div class="frow">
      <input type="text" id="fSearch" placeholder="ابحث..." oninput="applyFilters()" style="direction:rtl"/>
      <button class="icnbtn" onclick="loadExpenses()">↻</button>
    </div>
    <div class="frow">
      <select id="fCat" onchange="applyFilters()"><option value="">كل التصنيفات</option></select>
      <select id="fType" onchange="applyFilters()"><option value="">كل الفئات</option></select>
    </div>
    <div class="frow">
      <select id="fMethod" onchange="applyFilters()">
        <option value="">كل طرق الدفع</option>
        <option>مدى</option><option>فيزا</option><option>تحويل</option><option>كاش</option>
      </select>
      <select id="fBank" onchange="applyFilters()"><option value="">كل البنوك</option></select>
    </div>
    <div class="frow">
      <input type="date" id="fFrom" onchange="applyFilters()"/>
      <input type="date" id="fTo" onchange="applyFilters()"/>
      <button class="icnbtn red" onclick="clearFilters()">مسح</button>
    </div>
  </div>
  <div class="elist" id="expenseList"><div class="empty">اضغط ↻ لتحميل المصروفات</div></div>
</div>

<!-- البنوك -->
<div class="page" id="page-banks">
  <div class="sbar">
    <div class="sbox"><div class="sl">إجمالي الأرصدة</div><div class="sv g" id="totalBal">—</div></div>
    <div class="sbox"><div class="sl">عدد البنوك</div><div class="sv" id="bankCnt">—</div></div>
  </div>
  <div class="card">
    <label class="fl">اسم البنك</label>
    <input type="text" id="newBankName" placeholder="مثال: بنك الراجحي"/>
    <label class="fl">رقم الحساب</label>
    <input type="text" id="newBankAccount" placeholder="اختياري"/>
    <label class="fl">الرصيد الابتدائي</label>
    <input type="number" id="newBankBal" placeholder="0"/>
    <button class="btn btn-main" style="margin-top:0.8rem" onclick="addBank()">إضافة بنك</button>
    <div class="st" id="bankAddSt"></div>
  </div>
  <div id="bankList"><div class="empty">لا توجد بنوك بعد</div></div>
</div>

<!-- التصنيفات -->
<div class="page" id="page-cats">
  <div class="add-cat-row">
    <input type="text" id="newCatName" placeholder="اسم تصنيف جديد..."/>
    <button class="add-btn" style="padding:0 1rem;border-radius:10px;font-size:0.9rem" onclick="addCat()">+ إضافة</button>
  </div>
  <div id="catGroups"><div class="empty">اضغط ↻ لتحميل التصنيفات</div></div>
  <div class="st" id="catSt"></div>
</div>

<!-- الإعدادات -->
<div class="page" id="page-settings">
  <div class="card">
    <label class="fl">رابط Google Apps Script</label>
    <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/..."/>
    <p class="hint">من Apps Script ← Deploy ← Manage deployments</p>
    <label class="fl" style="margin-top:1rem">البروم‌بت</label>
    <textarea id="promptText" style="height:180px;font-size:0.76rem;line-height:1.7"></textarea>
    <button class="btn btn-main" style="margin-top:0.8rem" onclick="saveSettings()">حفظ الإعدادات</button>
    <div class="st" id="settingsSt" style="margin-top:0.8rem"></div>
  </div>
</div>

<!-- Modal تعديل مصروف -->
<div class="mov" id="editModal" onclick="if(event.target===this)cm('editModal')">
  <div class="modal">
    <div class="modal-title">تعديل المصروف</div>
    <input type="hidden" id="editId"/>
    <div class="g2">
      <div><label class="fl">التاريخ</label><input type="date" id="editDate"/></div>
      <div><label class="fl">الوقت</label><input type="text" id="editTime" placeholder="HH:MM"/></div>
    </div>
    <label class="fl">الجهة / المتجر</label>
    <input type="text" id="editMerchant"/>
    <label class="fl">المبلغ</label>
    <input type="number" id="editAmount"/>
    <div class="g2" style="margin-top:0.75rem">
      <div><label class="fl">البنك</label><select id="editBank"></select></div>
      <div><label class="fl">طريقة الدفع</label>
        <select id="editMethod"><option>مدى</option><option>فيزا</option><option>تحويل</option><option>كاش</option></select>
      </div>
    </div>
    <div class="g2" style="margin-top:0.75rem">
      <div><label class="fl">التصنيف</label><select id="editCategory" onchange="updateTypeSelect('editCategory','editType')"></select></div>
      <div><label class="fl">الفئة</label><select id="editType"></select></div>
    </div>
    <label class="fl">ملاحظات</label>
    <input type="text" id="editNotes" placeholder="اختياري"/>
    <div class="brow">
      <button class="btn btn-main" onclick="saveEdit()">حفظ</button>
      <button class="btn btn-ghost" onclick="cm('editModal')">إلغاء</button>
    </div>
    <div class="st" id="editSt" style="margin-top:0.7rem"></div>
  </div>
</div>

<!-- Modal تعديل بنك -->
<div class="mov" id="bankModal" onclick="if(event.target===this)cm('bankModal')">
  <div class="modal">
    <div class="modal-title">تعديل البنك</div>
    <input type="hidden" id="editBankId"/>
    <label class="fl">اسم البنك</label>
    <input type="text" id="editBankName"/>
    <label class="fl">رقم الحساب</label>
    <input type="text" id="editBankAccount" placeholder="اختياري"/>
    <label class="fl">الرصيد</label>
    <input type="number" id="editBankBal"/>
    <div class="brow">
      <button class="btn btn-main" onclick="saveBank()">حفظ</button>
      <button class="btn btn-ghost" onclick="cm('bankModal')">إلغاء</button>
    </div>
    <div class="st" id="bankEditSt" style="margin-top:0.7rem"></div>
  </div>
</div>

<script>
const DEFAULT_URL = "https://script.google.com/macros/s/AKfycby8Scr0Gnjav5ldCjUt2JEXV-bIK-hkTZ-Jh5YNwpeqS3wjNpwJb5KM0cIW3sQ83QTm/exec";
const DEFAULT_PROMPT = `لديك رسائل بنكية. استخرج من كل رسالة البيانات وأرجع JSON array فقط بدون أي نص إضافي أو backticks:
[{"date":"YYYY-MM-DD","time":"HH:MM","bank":"اسم البنك من قائمة البنوك المسجلة بمطابقة رقم الحساب أو البطاقة","merchant":"اسم الجهة","amount":0,"method":"مدى أو فيزا أو تحويل أو كاش","category":"من قائمة التصنيفات المتاحة","type":"الفئة المناسبة تحت التصنيف"}]`;

let expenses=[], banks=[], grouped={}, analyzedItems=[];

const url = () => localStorage.getItem('script_url') || DEFAULT_URL;
const prompt_ = () => localStorage.getItem('prompt_text') || DEFAULT_PROMPT;

async function api(params, isGet=false) {
  if (params.action === 'analyze') {
    const r = await fetch(url(), {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(params)});
    return r.json();
  }
  const r = await fetch(url()+'?'+new URLSearchParams(params));
  return r.json();
}

function sw(name) {
  ['record','view','banks','cats','settings'].forEach((n,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', n===name);
    document.getElementById('page-'+n).classList.toggle('active', n===name);
  });
  if (name==='view') { loadExpenses(); loadCats(); loadBanks(); }
  if (name==='banks') loadBanks();
  if (name==='cats') loadCats();
}

function cm(id) { document.getElementById(id).classList.remove('show'); }

function st(id, msg, type) {
  const el = document.getElementById(id);
  el.className='st '+type; el.innerHTML=msg;
  if (type==='ok') setTimeout(()=>el.className='st', 2500);
}

const fd = d => d ? String(d).split('T')[0] : '—';
const fa = a => (a||a===0) ? Number(a).toLocaleString('ar-SA')+' ر.س' : '—';

function loadSettings() {
  document.getElementById('scriptUrl').value = localStorage.getItem('script_url') || DEFAULT_URL;
  document.getElementById('promptText').value = localStorage.getItem('prompt_text') || DEFAULT_PROMPT;
}

function saveSettings() {
  localStorage.setItem('script_url', document.getElementById('scriptUrl').value.trim());
  localStorage.setItem('prompt_text', document.getElementById('promptText').value.trim());
  st('settingsSt','✅ تم الحفظ','ok');
}

function toggleManual() {
  const f = document.getElementById('manualForm');
  const opening = f.style.display==='none';
  f.style.display = opening ? 'block' : 'none';
  if (opening) {
    const now = new Date();
    if (!document.getElementById('mDate').value)
      document.getElementById('mDate').value = now.toISOString().split('T')[0];
    if (!document.getElementById('mTime').value)
      document.getElementById('mTime').value = now.toTimeString().slice(0,5);
  }
}

// populate selects from grouped
function populateCatSelect(id) {
  const el = document.getElementById(id);
  const cur = el.value;
  el.innerHTML = '<option value="">اختر التصنيف</option>' +
    Object.keys(grouped).map(c=>`<option value="${c}">${c}</option>`).join('');
  if (cur) el.value = cur;
}

function updateTypeSelect(catId, typeId) {
  const cat = document.getElementById(catId).value;
  const el = document.getElementById(typeId);
  const cur = el.value;
  const types = grouped[cat] || [];
  el.innerHTML = '<option value="">اختر الفئة</option>' +
    types.map(t=>`<option value="${t.type}">${t.type}</option>`).join('');
  if (cur) el.value = cur;
}

function populateBankSelect(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const cur = el.value;
  el.innerHTML = '<option value="">اختر البنك</option>' +
    banks.map(b=>`<option value="${b.name}">${b.name}</option>`).join('');
  if (cur) el.value = cur;
}

// analyze
async function analyze() {
  const sms = document.getElementById('smsText').value.trim();
  if (!sms) return st('analyzeSt','الرجاء لصق رسالة البنك','er');
  const btn = document.getElementById('analyzeBtn');
  btn.disabled=true; btn.innerHTML='<span class="sp"></span>جاري التحليل...';
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('saveAnalyzedBtn').style.display='none';
  st('analyzeSt','يتم التحليل...','ld');
  analyzedItems=[];
  try {
    const r = await api({ action:'analyze', sms, prompt:prompt_() });
    if (r.status!=='success') throw new Error(r.message);
    analyzedItems = Array.isArray(r.data) ? r.data : [r.data];
    document.getElementById('resultItems').innerHTML = analyzedItems.map((d,i)=>`
      ${i>0?'<hr class="rdivider">':''}
      <div class="rg">
        <div class="ri"><div class="rl">التاريخ</div><div class="rv">${fd(d.date)}</div></div>
        <div class="ri"><div class="rl">الوقت</div><div class="rv">${d.time||'—'}</div></div>
        <div class="ri"><div class="rl">البنك</div><div class="rv">${d.bank||'—'}</div></div>
        <div class="ri"><div class="rl">الجهة</div><div class="rv">${d.merchant||'—'}</div></div>
        <div class="ri"><div class="rl">طريقة الدفع</div><div class="rv">${d.method||'—'}</div></div>
        <div class="ri"><div class="rl">التصنيف</div><div class="rv">${d.category||'—'}</div></div>
        <div class="ri"><div class="rl">الفئة</div><div class="rv">${d.type||'—'}</div></div>
        <div class="ri full amt"><div class="rl">المبلغ</div><div class="rv">${fa(d.amount)}</div></div>
      </div>
    `).join('');
    st('analyzeSt',`✅ تم تحليل ${analyzedItems.length} عملية — راجع البيانات ثم اضغط إضافة`,'ok');
    document.getElementById('saveAnalyzedBtn').style.display='block';
  } catch(e) {
    st('analyzeSt','❌ '+e.message,'er');
  } finally {
    btn.disabled=false; btn.innerHTML='تحليل';
  }
}

async function saveAnalyzed() {
  if (!analyzedItems.length) return;
  const btn = document.getElementById('saveAnalyzedBtn');
  btn.disabled=true; btn.innerHTML='<span class="sp"></span>جاري الحفظ...';
  try {
    for (const d of analyzedItems) {
      const r = await api({action:'addExpense',date:d.date,time:d.time||'',merchant:d.merchant,amount:d.amount,method:d.method,bank:d.bank,category:d.category,type:d.type,notes:''});
      if (r.status!=='success') throw new Error(r.message);
    }
    st('analyzeSt',`✅ تم حفظ ${analyzedItems.length} عملية`,'ok');
    document.getElementById('smsText').value='';
    analyzedItems=[];
    btn.style.display='none';
    loadBanks();
  } catch(e) {
    st('analyzeSt','❌ '+e.message,'er');
    btn.disabled=false; btn.innerHTML='إضافة للسجل';
  }
}

async function addManual() {
  const body = {
    action:'addExpense',
    date:document.getElementById('mDate').value,
    time:document.getElementById('mTime').value,
    merchant:document.getElementById('mMerchant').value,
    amount:document.getElementById('mAmount').value,
    bank:document.getElementById('mBank').value,
    method:document.getElementById('mMethod').value,
    category:document.getElementById('mCategory').value,
    type:document.getElementById('mType').value,
    notes:document.getElementById('mNotes').value
  };
  if (!body.merchant||!body.amount) return st('manualSt','أدخل الجهة والمبلغ','er');
  st('manualSt','<span class="sp"></span>جاري الإضافة...','ld');
  try {
    const r = await api(body);
    if (r.status!=='success') throw new Error(r.message);
    st('manualSt','✅ تمت الإضافة','ok');
  } catch(e) { st('manualSt','❌ '+e.message,'er'); }
}

// expenses
async function loadExpenses() {
  document.getElementById('expenseList').innerHTML='<div class="empty"><span class="sp"></span></div>';
  try {
    const r = await api({action:'getExpenses'}, true);
    expenses = r.rows||[];
    applyFilters();
  } catch(e) {
    document.getElementById('expenseList').innerHTML=`<div class="empty">❌ ${e.message}</div>`;
  }
}

function applyFilters() {
  let list = [...expenses];
  const q = document.getElementById('fSearch').value.toLowerCase();
  const cat = document.getElementById('fCat').value;
  const type = document.getElementById('fType').value;
  const method = document.getElementById('fMethod').value;
  const bank = document.getElementById('fBank').value;
  const from = document.getElementById('fFrom').value;
  const to = document.getElementById('fTo').value;
  if (q) list=list.filter(e=>(e.merchant||'').toLowerCase().includes(q)||(e.bank||'').toLowerCase().includes(q));
  if (cat) list=list.filter(e=>e.category===cat);
  if (type) list=list.filter(e=>e.type===type);
  if (method) list=list.filter(e=>e.method===method);
  if (bank) list=list.filter(e=>e.bank===bank);
  if (from) list=list.filter(e=>fd(e.date)>=from);
  if (to) list=list.filter(e=>fd(e.date)<=to);
  renderExpenses(list);
}

function clearFilters() {
  ['fSearch','fCat','fType','fMethod','fBank','fFrom','fTo'].forEach(id=>document.getElementById(id).value='');
  applyFilters();
}

function renderExpenses(list) {
  const total = list.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  document.getElementById('totalAmt').textContent = total.toLocaleString('ar-SA')+' ر.س';
  document.getElementById('totalCnt').textContent = list.length;
  const cats={};
  list.forEach(e=>{ const c=e.category||'أخرى'; cats[c]=(cats[c]||0)+(parseFloat(e.amount)||0); });
  document.getElementById('catGrid').innerHTML=Object.entries(cats).sort((a,b)=>b[1]-a[1])
    .map(([c,v])=>`<div class="cbox"><span class="cn">${c}</span><span class="cv">${v.toLocaleString('ar-SA')} ر.س</span></div>`).join('');
  if (!list.length) { document.getElementById('expenseList').innerHTML='<div class="empty">لا توجد نتائج</div>'; return; }
  document.getElementById('expenseList').innerHTML=list.slice().reverse().map(e=>`
    <div class="eitem">
      <div class="etop">
        <div><div class="em">${e.merchant||'—'}</div><div class="emeta">${fd(e.date)} ${e.time||''} · ${e.bank||''}</div></div>
        <div class="ea">${fa(e.amount)}</div>
      </div>
      ${e.notes?`<div style="font-size:0.75rem;color:#6b7280;margin-bottom:0.35rem;padding:0.3rem 0.5rem;background:#f8fafc;border-radius:6px">${e.notes}</div>`:''}
      <div class="ebot">
        <div class="tags">
          ${e.category?`<span class="tag tcat">${e.category}</span>`:''}
          ${e.type?`<span class="tag ttype">${e.type}</span>`:''}
          ${e.method?`<span class="tag tmeth">${e.method}</span>`:''}
        </div>
        <div class="eacts">
          <button class="abtn" onclick="openEdit('${e.id}')">تعديل</button>
          <button class="abtn del" onclick="delExpense('${e.id}',this)">حذف</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openEdit(id) {
  const e=expenses.find(x=>String(x.id)===String(id)); if(!e) return;
  document.getElementById('editId').value=id;
  document.getElementById('editDate').value=fd(e.date);
  document.getElementById('editTime').value=e.time||'';
  document.getElementById('editMerchant').value=e.merchant||'';
  document.getElementById('editAmount').value=e.amount||'';
  document.getElementById('editMethod').value=e.method||'مدى';
  populateBankSelect('editBank');
  populateCatSelect('editCategory');
  document.getElementById('editBank').value=e.bank||'';
  document.getElementById('editCategory').value=e.category||'';
  updateTypeSelect('editCategory','editType');
  document.getElementById('editType').value=e.type||'';
  document.getElementById('editNotes').value=e.notes||'';
  document.getElementById('editSt').className='st';
  document.getElementById('editModal').classList.add('show');
}

async function saveEdit() {
  const body={
    action:'updateExpense',
    id:document.getElementById('editId').value,
    date:document.getElementById('editDate').value,
    time:document.getElementById('editTime').value,
    merchant:document.getElementById('editMerchant').value,
    amount:document.getElementById('editAmount').value,
    bank:document.getElementById('editBank').value,
    method:document.getElementById('editMethod').value,
    category:document.getElementById('editCategory').value,
    type:document.getElementById('editType').value,
    notes:document.getElementById('editNotes').value
  };
  st('editSt','<span class="sp"></span>جاري الحفظ...','ld');
  try {
    const r=await api(body);
    if(r.status!=='success') throw new Error(r.message);
    st('editSt','✅ تم التعديل','ok');
    setTimeout(()=>{ cm('editModal'); loadExpenses(); },700);
  } catch(e) { st('editSt','❌ '+e.message,'er'); }
}

async function delExpense(id,btn) {
  if(!confirm('حذف هذا المصروف؟')) return;
  btn.textContent='...'; btn.disabled=true;
  try { await api({action:'deleteExpense',id}); loadExpenses(); }
  catch(e) { alert('❌ '+e.message); btn.textContent='حذف'; btn.disabled=false; }
}

// banks
async function loadBanks() {
  try {
    const r=await api({action:'getBanks'},true);
    banks=r.rows||[];
    renderBanks();
    populateBankSelect('mBank');
    populateBankSelect('fBank');
  } catch(e) { document.getElementById('bankList').innerHTML=`<div class="empty">❌ ${e.message}</div>`; }
}

function renderBanks() {
  const total=banks.reduce((s,b)=>s+(parseFloat(b.balance)||0),0);
  document.getElementById('totalBal').textContent=total.toLocaleString('ar-SA')+' ر.س';
  document.getElementById('bankCnt').textContent=banks.length;
  document.getElementById('bankList').innerHTML=banks.map(b=>`
    <div class="bitem">
      <div><div class="bname">${b.name}</div>${b.account?`<div class="bupdated">رقم الحساب: ${b.account}</div>`:''}<div class="bupdated">${fd(b.updated)}</div></div>
      <div style="text-align:left">
        <div class="bbal">${fa(b.balance)}</div>
        <div class="eacts" style="margin-top:0.35rem;justify-content:flex-end">
          <button class="abtn" onclick="openBankEdit('${b.id}')">تعديل</button>
          <button class="abtn del" onclick="delBank('${b.id}',this)">حذف</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function addBank() {
  const name=document.getElementById('newBankName').value.trim();
  const balance=document.getElementById('newBankBal').value;
  if(!name) return st('bankAddSt','أدخل اسم البنك','er');
  st('bankAddSt','<span class="sp"></span>جاري الإضافة...','ld');
  try {
    const account=document.getElementById('newBankAccount').value.trim();
  const r=await api({action:'addBank',name,account,balance});
    if(r.status!=='success') throw new Error(r.message);
    document.getElementById('newBankName').value='';
    document.getElementById('newBankBal').value='';
    document.getElementById('newBankAccount').value='';
    st('bankAddSt','✅ تمت الإضافة','ok');
    loadBanks();
  } catch(e) { st('bankAddSt','❌ '+e.message,'er'); }
}

function openBankEdit(id) {
  const b=banks.find(x=>x.id===id); if(!b) return;
  document.getElementById('editBankId').value=id;
  document.getElementById('editBankName').value=b.name||'';
  document.getElementById('editBankAccount').value=b.account||'';
  document.getElementById('editBankBal').value=b.balance||'';
  document.getElementById('bankEditSt').className='st';
  document.getElementById('bankModal').classList.add('show');
}

async function saveBank() {
  const body={action:'updateBank',id:document.getElementById('editBankId').value,name:document.getElementById('editBankName').value,account:document.getElementById('editBankAccount').value,balance:document.getElementById('editBankBal').value};
  st('bankEditSt','<span class="sp"></span>جاري الحفظ...','ld');
  try {
    const r=await api(body);
    if(r.status!=='success') throw new Error(r.message);
    st('bankEditSt','✅ تم التعديل','ok');
    setTimeout(()=>{ cm('bankModal'); loadBanks(); },700);
  } catch(e) { st('bankEditSt','❌ '+e.message,'er'); }
}

async function delBank(id,btn) {
  if(!confirm('حذف هذا البنك؟')) return;
  btn.textContent='...'; btn.disabled=true;
  try { await api({action:'deleteBank',id}); loadBanks(); }
  catch(e) { alert('❌ '+e.message); btn.textContent='حذف'; btn.disabled=false; }
}

// categories
async function loadCats() {
  try {
    const r=await api({action:'getCategories'},true);
    grouped=r.grouped||{};
    renderCats();
    populateCatSelect('mCategory');
    populateCatSelect('fCat');
    populateCatSelect('editCategory');
    const allTypes=[...new Set(Object.values(grouped).flat().map(t=>t.type))];
    const fType=document.getElementById('fType');
    const cur=fType.value;
    fType.innerHTML='<option value="">كل الفئات</option>'+allTypes.map(t=>`<option value="${t}">${t}</option>`).join('');
    if(cur) fType.value=cur;
  } catch(e) { console.log(e); }
}

function renderCats() {
  document.getElementById('catGroups').innerHTML=Object.entries(grouped).map(([cat,types])=>`
    <div class="cat-group">
      <div class="cat-header">
        <span class="cat-header-name">📁 ${cat}</span>
        <button class="abtn del" onclick="delCat('${cat}',null)">حذف التصنيف</button>
      </div>
      <div class="cat-types">
        ${types.map(t=>`
          <div class="type-item">
            <span class="type-name">• ${t.type}</span>
            <button class="abtn del" onclick="delCat('${cat}','${t.id}')">حذف</button>
          </div>
        `).join('')}
        <div class="add-row">
          <input type="text" placeholder="إضافة فئة جديدة..." id="newType_${cat}"/>
          <button class="add-btn" onclick="addType('${cat}')">إضافة</button>
        </div>
      </div>
    </div>
  `).join('');
}

async function addCat() {
  const name=document.getElementById('newCatName').value.trim();
  if(!name) return;
  st('catSt','<span class="sp"></span>جاري الإضافة...','ld');
  try {
    const r=await api({action:'addCategory',category:name,type:''});
    if(r.status!=='success') throw new Error(r.message);
    document.getElementById('newCatName').value='';
    st('catSt','✅ تمت الإضافة','ok');
    loadCats();
  } catch(e) { st('catSt','❌ '+e.message,'er'); }
}

async function addType(cat) {
  const inp=document.getElementById('newType_'+cat);
  const val=inp.value.trim(); if(!val) return;
  st('catSt','<span class="sp"></span>جاري الإضافة...','ld');
  try {
    const r=await api({action:'addCategory',category:cat,type:val});
    if(r.status!=='success') throw new Error(r.message);
    inp.value='';
    st('catSt','✅ تمت الإضافة','ok');
    loadCats();
  } catch(e) { st('catSt','❌ '+e.message,'er'); }
}

async function delCat(cat, typeId) {
  const msg = typeId ? 'حذف هذه الفئة؟' : `حذف تصنيف "${cat}" وكل فئاته؟`;
  if(!confirm(msg)) return;
  st('catSt','<span class="sp"></span>جاري الحذف...','ld');
  try {
    const r=await api({action:'deleteCategory',category:cat,id:typeId});
    if(r.status!=='success') throw new Error(r.message);
    st('catSt','✅ تم الحذف','ok');
    loadCats();
  } catch(e) { st('catSt','❌ '+e.message,'er'); }
}

if (localStorage.getItem('script_url') !== DEFAULT_URL) localStorage.removeItem('script_url');
loadSettings();
loadBanks();
loadCats();
</script>
